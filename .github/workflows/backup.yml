name: Daily DB backup

on:
  schedule:
    - cron: '17 3 * * *'     # 03:17 UTC daily
  workflow_dispatch:          # manual trigger for testing

jobs:
  dump:
    runs-on: ubuntu-latest
    steps:
      - name: Install pg_dump 17
        run: |
          sudo sh -c 'echo "deb https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" > /etc/apt/sources.list.d/pgdg.list'
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | sudo gpg --dearmor -o /etc/apt/trusted.gpg.d/postgresql.gpg
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-client-17

      - name: Dump public schema
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          mkdir -p backups
          TS=$(date -u +%Y%m%dT%H%M%SZ)
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema=public \
            --no-owner --no-privileges \
            --format=custom \
            --file="backups/tuxedo-$TS.dump"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: tuxedo-backup-${{ github.run_id }}
          path: backups/
          retention-days: 90
          
      - name: Verify dump is restorable
        run: |
          echo "=== TOC (should list your tables) ==="
          /usr/lib/postgresql/17/bin/pg_restore --list backups/tuxedo-*.dump | tee toc.txt
          grep -qE 'TABLE (DATA )?public\.(profiles|coders|funds|cases|code_changes)' toc.txt \
            || { echo "Dump missing expected tables"; exit 1; }